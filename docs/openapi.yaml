openapi: 3.0.3
info:
  title: Watchtower API
  version: 1.0.0
  description: |
    Watchtower REST API for authorized security monitoring.

    Authentication: Bearer tokens (HMAC-signed, short-lived). Issue via the
    Telegram bot or via the `/v1/auth/token` endpoint (TODO).
servers:
  - url: https://watchtower.example.workers.dev
    description: Production
  - url: http://localhost:8787
    description: Local dev

security:
  - BearerAuth: []

paths:
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Service status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  time: { type: string, format: date-time }

  /v1/targets:
    get:
      summary: List targets for the caller's organization
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Targets
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      targets:
                        type: array
                        items: { $ref: '#/components/schemas/Target' }
                  request_id: { type: string }

  /v1/targets/{id}:
    get:
      summary: Get a single target
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Target, content: { application/json: { schema: { $ref: '#/components/schemas/TargetResponse' } } } }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/targets/{id}/scope:
    get:
      summary: List scope entries for a target
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Scope entries }

  /v1/findings:
    get:
      summary: List findings
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: status, in: query, schema: { type: string, enum: [open, assigned, in_review, resolved, closed, reopened] } }
        - { name: severity, in: query, schema: { type: string, enum: [informational, low, medium, high, critical] } }
      responses:
        '200': { description: Findings }

  /v1/findings/{id}:
    get:
      summary: Get a single finding
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Finding }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/findings/{id}/status:
    patch:
      summary: Update a finding's status
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [open, assigned, in_review, resolved, closed, reopened] }
                verification_state: { type: string, enum: [detected, suspected, verified, confirmed_human, false_positive, rejected] }
      responses:
        '200': { description: Updated }

  /v1/findings/{id}/assign:
    post:
      summary: Assign a finding
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string }
      responses:
        '200': { description: Assigned }

  /v1/reports:
    post:
      summary: Generate a report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_id, format]
              properties:
                target_id: { type: string }
                format: { type: string, enum: [markdown, json, pdf, hackerone, bugcrowd, internal, executive] }
                methodology: { type: string }
                tools: { type: array, items: { type: string } }
                limitations: { type: array, items: { type: string } }
                scope_text: { type: string }
      responses:
        '200': { description: Report generated }

  /v1/evidence:
    get:
      summary: List evidence for a finding
      parameters:
        - { name: finding_id, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: Evidence list }

  /v1/evidence/download:
    get:
      summary: Download evidence via signed URL
      parameters:
        - { name: key, in: query, required: true, schema: { type: string } }
        - { name: expires, in: query, required: true, schema: { type: string } }
        - { name: sig, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Evidence content }
        '401': { description: Invalid or expired signature }

  /v1/audit:
    get:
      summary: List audit logs
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 } }
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        '200': { description: Audit logs }

  /v1/runner/callback:
    post:
      summary: External runner result callback
      security: []
      description: |
        Endpoint for external scanner runners to post HMAC-signed result
        payloads. The signature is verified before any state is updated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RunnerResultPayload' }
      responses:
        '200': { description: Accepted }
        '401': { description: Invalid signature }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Target:
      type: object
      properties:
        id: { type: string }
        organization_id: { type: string }
        name: { type: string }
        passive_only: { type: boolean }
        low_impact_active: { type: boolean }
        intrusive_enabled: { type: boolean }
        max_request_rate_per_min: { type: integer }
        max_concurrent_jobs: { type: integer }
        program_rules_url: { type: string, nullable: true }
        authorization_reference: { type: string }
        authorization_expires_at: { type: string, format: date-time }
        paused: { type: boolean }
        created_at: { type: string, format: date-time }
    TargetResponse:
      type: object
      properties:
        ok: { type: boolean }
        data: { type: object, properties: { target: { $ref: '#/components/schemas/Target' } } }
        request_id: { type: string }
    Error:
      type: object
      properties:
        ok: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
        request_id: { type: string }
    RunnerResultPayload:
      type: object
      required: [job_id, scan_job_id, status, tool, exit_code, duration_seconds, artifacts, scope_validation_passed, timestamp, signature]
      properties:
        job_id: { type: string }
        scan_job_id: { type: string }
        status: { type: string, enum: [completed, failed, timeout, cancelled] }
        tool: { type: string }
        stdout_b64: { type: string }
        stderr_b64: { type: string }
        exit_code: { type: integer }
        duration_seconds: { type: integer }
        artifacts:
          type: array
          items:
            type: object
            properties:
              filename: { type: string }
              sha256: { type: string }
              size_bytes: { type: integer }
        scope_validation_passed: { type: boolean }
        timestamp: { type: string, format: date-time }
        signature: { type: string }
