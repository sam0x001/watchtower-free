name = "watchtower"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
send_metrics = false

# ---------------------------------------------------------------------------
# FREE TIER configuration
#
# This wrangler.toml is designed to run on Cloudflare Workers FREE plan:
#   - NO Queues (async work via ctx.waitUntil + D1 job_queue table)
#   - NO Durable Objects (replaced with D1 row state)
#   - 1 Cron Trigger (free-tier limit) — 5-min interval with internal dispatch
#   - 10ms CPU per invocation (work runs in waitUntil)
#   - 100k Worker requests/day (sufficient for 5-min cron + occasional msgs)
#   - D1: 5M reads + 100k writes/day, 5 GB storage
#   - R2: 10 GB storage, 1M+10M operations/month
#   - KV: 100k reads + 1k writes/day
# ---------------------------------------------------------------------------

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
invocation_logs = true

# ---------------------------------------------------------------------------
# Static configuration (non-secret)
# ---------------------------------------------------------------------------
[vars]
WATCHTOWER_ENV = "production"
USER_AGENT = "Watchtower/4.0 (bug-bounty-monitoring)"

# Free-tier job bounds
FREE_TIER_MAX_JOBS_PER_CRON = "2"            # scan jobs claimed per cron tick
FREE_TIER_MAX_NOTIFICATIONS_PER_CRON = "10"  # notification jobs per tick
FREE_TIER_SCAN_TIMEOUT_MS = "60000"          # wall-clock budget per scan job

# Scan pipeline tuning
PASSIVE_RESCAN_MINUTES = "30"     # how often each target is re-scanned
BRUTEFORCE_CHUNK = "300"          # subdomain wordlist entries resolved per tick
BRUTEFORCE_CONCURRENCY = "16"     # parallel DoH lookups during bruteforce
PROBE_LIMIT_PER_SCAN = "5"        # HTTP probes (incl. JS + fuzz) per tick
FUZZ_REQUESTS_PER_TICK = "40"     # wordlist fuzz requests per host per tick

# ---------------------------------------------------------------------------
# Bundled wordlists are imported as text modules
# (`import fuzzTxt from "../../fuzz-wordlists/fuzz.txt"`).
# This rule makes Wrangler inline them instead of treating them as assets.
# ---------------------------------------------------------------------------
[[rules]]
type = "Text"
globs = ["**/fuzz-wordlists/*.txt"]
fallthrough = false


# ---------------------------------------------------------------------------
# D1 — targets, scope/exclusions, assets, scans, findings, job queue,
#      notification log (FREE: 5 GB, no payment method required).
# ---------------------------------------------------------------------------
[[d1_databases]]
binding = "DB"
database_name = "watchtower-db"
database_id = ""
migrations_dir = "migrations"

# NOTE: R2 is not used at all anymore — the report/evidence features that needed
# it are gone. Findings and notification history live in D1 only.

# ---------------------------------------------------------------------------
# KV — cursors (subdomain bruteforce + fuzz wordlists) and the wildcard-DNS
#      cache (FREE: 100k reads + 1k writes/day)
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "CACHE"
id = ""
preview_id = ""

# ---------------------------------------------------------------------------
# SINGLE Cron Trigger — free tier allows only 1 per worker.
# src/cron/handler.ts runs the whole pipeline on this tick.
# ---------------------------------------------------------------------------
[triggers]
crons = ["*/5 * * * *"]  # every 5 minutes

# ---------------------------------------------------------------------------
# Secrets — set via `wrangler secret put <NAME>` (NEVER in this file)
# ---------------------------------------------------------------------------
# TELEGRAM_BOT_TOKEN
# TELEGRAM_WEBHOOK_SECRET
# AUTHORIZED_TELEGRAM_IDS (comma-separated bootstrap allowlist; extend with /allow)
# REDACTION_SALT (any long random string — salts secret fingerprints)

# ---------------------------------------------------------------------------
# Dev overrides (local `wrangler dev`)
# ---------------------------------------------------------------------------
[env.dev]
name = "watchtower-dev"
workers_dev = true

[env.dev.vars]
WATCHTOWER_ENV = "dev"
FREE_TIER_MAX_JOBS_PER_CRON = "1"
FREE_TIER_MAX_NOTIFICATIONS_PER_CRON = "5"
